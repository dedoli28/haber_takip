name: Finviz Tarama

on:
  schedule:
    # Her 15 dakikada bir calisir. GitHub Actions'in zamanlamasi birebir
    # dakikasinda garanti degildir (yogun saatlerde birkac dakika gecikebilir)
    # ama cron-job.org'un aksine sabit 30 saniyelik bir yanit suresi siniri
    # YOKTUR - istegin ne kadar surecegini asagida biz belirliyoruz.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # Actions sekmesinden elle de tetiklenebilir

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - name: /api/tara tetikle
        run: |
          curl -sS -X POST "https://haber-takip-nper.vercel.app/api/tara" \
            -H "x-poll-secret: ${{ secrets.POLL_SECRET }}" \
            --max-time 55 \
            --fail-with-body
